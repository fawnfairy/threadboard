<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Threadboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --bg:#e9edf2;--dot:#c3ccd8;--ink:#1b2430;--mute:#6b7788;--card:#fff;--line:#4f6b95;--edge:#d5dce6;
  --c0:#ffffff;--c1:#fff3b8;--c2:#cfe9ff;--c3:#d9f2d4;--c4:#ffd9d4;--c5:#e5dbff;
  --ui:#fff;--shadow:0 1px 2px rgba(20,30,50,.12),0 6px 18px rgba(20,30,50,.08);
}
:root[data-mode=dark]{
  --bg:#161a21;--dot:#2c3340;--ink:#e8ecf2;--mute:#8e9aad;--card:#232a35;--line:#7fa0d4;--edge:#343d4c;
  --c0:#232a35;--c1:#4a4220;--c2:#1f3a52;--c3:#24402a;--c4:#4d2a27;--c5:#382f55;--ui:#232a35;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 6px 18px rgba(0,0,0,.35)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0;cursor:grab;touch-action:none;
  background-image:radial-gradient(var(--dot) 1.2px,transparent 1.3px)}
#stage.pan{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#links{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
#links path{fill:none;stroke:var(--line);stroke-width:1.6;opacity:.75}
#links polygon{fill:var(--line);opacity:.85}
.card{position:absolute;min-width:180px;max-width:640px;background:var(--card);border-radius:10px;
  box-shadow:var(--shadow);border:1px solid var(--edge);resize:horizontal;overflow:hidden;
  display:flex;flex-direction:column}
.card.flash{outline:3px solid var(--line);outline-offset:2px}
.card[data-c="1"]{background:var(--c1)}.card[data-c="2"]{background:var(--c2)}
.card[data-c="3"]{background:var(--c3)}.card[data-c="4"]{background:var(--c4)}.card[data-c="5"]{background:var(--c5)}
.bar{height:22px;display:flex;align-items:center;justify-content:space-between;padding:0 8px;cursor:move;flex:none}
.dot{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--mute);cursor:pointer;display:inline-block}
.x{border:0;background:none;color:var(--mute);font-size:16px;line-height:1;cursor:pointer;padding:0 2px;opacity:0}
.card:hover .x{opacity:1}
.t{border:0;background:none;outline:0;color:var(--ink);padding:0 12px 4px;width:100%;
  font:600 17px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
.b,.ed{padding:2px 12px 12px;min-height:56px;white-space:pre-wrap;word-wrap:break-word;font-size:14px;line-height:1.55}
.b:empty::before{content:"Write here. [[Link]] notes, or type @ to reference one.";color:var(--mute)}
.ed{display:none;width:100%;border:0;outline:0;resize:none;background:none;color:var(--ink);font-family:inherit}
.lk{color:var(--line);font-weight:500;cursor:pointer;border-bottom:1px solid currentColor}
.lk.new{border-bottom-style:dashed;opacity:.7}
.bl{display:flex;flex-wrap:wrap;gap:4px;padding:0 10px 9px}
.bl:empty{display:none}
.bl span{font-size:12px;color:var(--mute);padding:1px 8px;border-radius:99px;border:1px solid var(--edge);cursor:pointer}
.bl span:hover{color:var(--ink);border-color:var(--mute)}
.bl em{font-style:normal;font-size:12px;color:var(--mute);margin-right:2px}
#bar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:2px;align-items:center;
  background:var(--ui);padding:5px;border-radius:12px;box-shadow:var(--shadow);border:1px solid var(--edge);z-index:5}
#bar button{border:0;background:none;color:var(--ink);font:inherit;padding:6px 11px;border-radius:8px;cursor:pointer}
#bar button:hover{background:var(--bg)}
#bar b{font-weight:500;color:var(--mute);min-width:46px;text-align:center;font-size:12px}
#bar hr{width:1px;height:18px;border:0;background:var(--edge);margin:0 3px}
#find{position:fixed;inset:0;background:rgba(10,15,25,.35);display:none;align-items:flex-start;justify-content:center;padding-top:15vh;z-index:9}
#find div{width:min(480px,90vw);background:var(--ui);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
#find input{width:100%;border:0;outline:0;padding:14px 16px;font:inherit;font-size:16px;background:none;color:var(--ink);border-bottom:1px solid var(--edge)}
#find li{list-style:none;padding:9px 16px;cursor:pointer}
#find li.on,#find li:hover{background:var(--bg)}
#find ul{margin:0;padding:0;max-height:300px;overflow:auto}
#toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:7px 14px;border-radius:8px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9}
.g{display:flex;gap:7px;align-items:center}
.cn{width:11px;height:11px;border-radius:50%;background:var(--line);cursor:crosshair;opacity:.3;display:inline-block}
.card:hover .cn{opacity:1}
.md{display:block;width:100%;border:0;background:rgba(127,127,127,.1)}
img.md,video.md{max-height:560px;object-fit:contain;height:auto}
iframe.md{height:400px}
audio.md{background:none;padding:2px 10px 8px}
.pvs{display:flex;flex-direction:column;gap:8px;padding:0 10px 10px}.pvs:empty{display:none}
.pv{border:1px solid var(--edge);border-radius:8px;overflow:hidden;background:rgba(127,127,127,.08)}
.pv>img,.pv>video{display:block;width:100%;max-height:300px;object-fit:contain}
.th{position:relative;aspect-ratio:16/9;background:#000;overflow:hidden}.th:empty{display:none}
.th img,.th iframe{width:100%;height:100%;border:0;object-fit:cover;display:block}
.th.v{cursor:pointer}
.pl{position:absolute;inset:0;margin:auto;width:46px;height:46px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;display:grid;place-items:center;font-size:16px}
.tx{display:block;padding:7px 10px;color:var(--ink);text-decoration:none}
.tx strong{display:block;font-weight:600;font-size:13px;line-height:1.35}
.tx small{display:block;color:var(--mute);font-size:12px;line-height:1.35;max-height:2.7em;overflow:hidden}
#links path.m{stroke-dasharray:6 5}
#links path.tmp{stroke-dasharray:3 4}
#links path.hit{stroke:transparent;stroke-width:14;stroke-dasharray:none;opacity:1;pointer-events:stroke;cursor:pointer}
#links path.hit:hover{stroke:var(--line);opacity:.25}
#pop{position:fixed;display:none;gap:7px;padding:9px;background:var(--ui);border:1px solid var(--edge);border-radius:10px;box-shadow:var(--shadow);z-index:8;flex-wrap:wrap;width:184px;align-items:center}
#pop i{width:22px;height:22px;border-radius:50%;border:1px solid var(--edge);cursor:pointer}
#pop input{width:24px;height:24px;padding:0;border:0;background:none;cursor:pointer}
#bar{left:calc(50% + var(--lw,0px)/2 - var(--rw,0px)/2)}
#side{position:fixed;left:12px;top:12px;bottom:12px;width:226px;background:var(--ui);border:1px solid var(--edge);border-radius:12px;box-shadow:var(--shadow);z-index:7;display:flex;flex-direction:column;transition:transform var(--dur) var(--ease)}
body.sc #side{transform:translateX(-100%)}
.sh{display:flex;align-items:center;justify-content:space-between;padding:12px 8px 8px 14px;font-weight:600}
.sh button,#so{border:0;background:none;color:var(--mute);font-size:18px;line-height:1;cursor:pointer;padding:4px 9px;border-radius:8px}
.sh button:hover,#so:hover{background:var(--bg);color:var(--ink)}
#so{position:fixed;left:12px;top:12px;z-index:6;display:none;background:var(--ui);border:1px solid var(--edge);box-shadow:var(--shadow);font-size:15px}
body.sc #so{display:block}
#wl{margin:0;padding:2px 6px;list-style:none;flex:1;overflow:auto}
#wl li{display:flex;align-items:center;gap:6px;padding:7px 8px;border-radius:8px;cursor:pointer}
#wl li:hover{background:var(--bg)}
#wl li.on{background:var(--bg);box-shadow:inset 3px 0 0 var(--line);font-weight:600}
.nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;outline:0}
.nm[contenteditable=plaintext-only]{text-overflow:clip;cursor:text;box-shadow:0 1px 0 var(--line)}
#wl em{font-style:normal;font-size:12px;color:var(--mute)}
.wx{border:0;background:none;color:var(--mute);cursor:pointer;font-size:15px;line-height:1;display:none;padding:0 2px}
#wl li:hover .wx{display:block}
#wn{margin:6px;padding:9px;border:1px dashed var(--edge);background:none;border-radius:8px;color:var(--mute);font:inherit;cursor:pointer}
#wn:hover{color:var(--ink);border-color:var(--mute)}
#empty{position:fixed;left:calc(50% + var(--lw,0px)/2 - var(--rw,0px)/2);top:45%;transform:translate(-50%,-50%);text-align:center;color:var(--mute);pointer-events:none;display:none;line-height:1.7}
#graph{position:fixed;inset:0;background:var(--bg);z-index:4;display:none}
#gcv{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#gh{position:absolute;top:14px;right:62px;display:flex;gap:12px;align-items:center;background:var(--ui);padding:6px 6px 6px 14px;border-radius:12px;box-shadow:var(--shadow);border:1px solid var(--edge);color:var(--mute);font-size:12px}
#gh button{border:0;background:var(--bg);color:var(--ink);font:inherit;font-size:13px;padding:6px 12px;border-radius:8px;cursor:pointer}
body.g #bar,body.g #empty{display:none!important}
#gp{position:fixed;top:14px;left:calc(var(--lw,0px) + 14px);width:236px;background:var(--ui);border:1px solid var(--edge);border-radius:12px;box-shadow:var(--shadow);padding:10px;display:flex;flex-direction:column;gap:9px;font-size:13px}
body.sc #gp{margin-left:46px}
#gq{width:100%;border:1px solid var(--edge);border-radius:8px;background:var(--bg);color:var(--ink);padding:7px 10px;font:inherit;outline:0}
#gq:focus{border-color:var(--line)}
.seg{display:flex;background:var(--bg);border-radius:8px;padding:2px}
.seg button{flex:1;border:0;background:none;color:var(--mute);font:inherit;font-size:12px;padding:5px 4px;border-radius:6px;cursor:pointer}
.seg button.on{background:var(--ui);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.18)}
#gw{display:none;flex-direction:column;gap:3px;max-height:190px;overflow:auto;padding:2px 0}
#gp label{display:flex;align-items:center;gap:7px;cursor:pointer;color:var(--ink)}
#gw i{width:10px;height:10px;border-radius:50%;flex:none}
#gw span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mn{display:inline-block;padding:0 8px;border-radius:99px;font-size:13px;line-height:1.6;cursor:pointer;font-weight:500;color:var(--line);background:color-mix(in srgb,var(--line) 16%,transparent)}
.mn::before{content:"@";opacity:.7;margin-right:1px}
.mn.ex{color:var(--wc);background:color-mix(in srgb,var(--wc) 13%,transparent);border:1px dashed var(--wc);padding:0 7px}
.mn.ex::after{content:"↗";margin-left:3px;font-size:11px}
.mn small{font-size:11px;margin:0 5px 0 3px;padding-right:5px;border-right:1px solid currentColor}
.mn.x{opacity:.5;cursor:default}
.bl span.ex{border-style:dashed;border-color:var(--wc);color:var(--wc)}
#mp{position:fixed;display:none;min-width:220px;max-width:330px;background:var(--ui);border:1px solid var(--edge);border-radius:10px;box-shadow:var(--shadow);padding:4px;z-index:9;font-size:13px}
#mp div{display:flex;justify-content:space-between;gap:12px;padding:6px 9px;border-radius:7px;cursor:pointer}
#mp div.on{background:var(--bg)}
#mp small{color:var(--wc,var(--mute));white-space:nowrap}
#bar button{display:grid;place-items:center;padding:7px 9px}
#bar svg{width:20px;height:20px;display:block;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#bar [data-tip]{position:relative}
#bar [data-tip]:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 14px);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:5px 9px;border-radius:7px;font-size:12px;white-space:nowrap;pointer-events:none;z-index:20}
#bi{display:flex;align-items:center;gap:2px;transition:width var(--dur) var(--ease),opacity .18s ease}
#bi>*{flex:none}#bi.clip{overflow:hidden}
body.bc #bi{opacity:0;pointer-events:none}
body.bc #bCol svg{transform:rotate(180deg)}
#cm{position:fixed;display:none;min-width:190px;background:var(--ui);border:1px solid var(--edge);border-radius:10px;box-shadow:var(--shadow);padding:5px;z-index:30;font-size:13px}
#cm button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--ink);font:inherit;padding:6px 10px;border-radius:6px;cursor:pointer}
#cm button:hover{background:var(--bg)}#cm button.dg{color:#d0453c}
#cm hr{border:0;height:1px;background:var(--edge);margin:4px 2px}
.fc{display:grid;place-items:center;height:84px;margin:0 12px;border-radius:10px;background:rgba(127,127,127,.12)}
.fc b{font:700 26px ui-monospace,Menlo,monospace;color:var(--mute)}
.fm{padding:6px 12px 8px;font-size:12px;color:var(--mute)}.fm a{color:var(--line)}
.pv2{margin:0 12px 10px;max-height:160px;overflow:auto;font:11.5px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;background:rgba(127,127,127,.1);padding:8px;border-radius:8px;white-space:pre-wrap}
#wl li.in{padding-left:24px}#wl li.fo{font-weight:600;color:var(--mute)}#wl li.dr{box-shadow:inset 0 2px 0 var(--line)}
.ch{width:12px;font-size:10px}
.wb{display:flex}.wb button{flex:1}
#wi{padding:6px 14px 4px;font-size:11.5px;color:var(--mute);line-height:1.5}
:root{--ease:cubic-bezier(.32,.72,0,1);--dur:.22s}
@keyframes pin{from{opacity:0;transform:translateY(-6px) scale(.97)}to{opacity:1;transform:none}}
@keyframes pout{to{opacity:0;transform:translateY(-4px) scale(.97)}}
@keyframes fin{from{opacity:0;max-height:0;padding-top:0;padding-bottom:0}to{opacity:1;max-height:44px}}
#pop,#cm,#mp,#nm,#gw,#find>div{animation:pin var(--dur) var(--ease);transform-origin:top left}
#pop.out,#cm.out,#mp.out,#nm.out{animation:pout .14s ease forwards}
body.sc #so{animation:pin var(--dur) var(--ease)}
#wl li{max-height:44px;overflow:hidden;transition:max-height var(--dur) var(--ease),opacity var(--dur) var(--ease),padding var(--dur) var(--ease)}
#wl li.in.col{max-height:0;opacity:0;padding-top:0;padding-bottom:0}
#wl li.enter{animation:fin var(--dur) var(--ease)}
.ch{display:inline-block;transition:transform var(--dur) var(--ease)}
#bCol svg{transition:transform var(--dur) var(--ease)}
.ht{display:flex;align-items:center;gap:2px}
#nm{position:fixed;display:none;min-width:170px;background:var(--ui);border:1px solid var(--edge);border-radius:10px;box-shadow:var(--shadow);padding:5px;z-index:30;font-size:13px}
#nm button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--ink);font:inherit;padding:7px 10px;border-radius:6px;cursor:pointer}
#nm button:hover{background:var(--bg)}
#ov{position:fixed;top:0;right:0;bottom:0;min-width:280px;background:var(--ui);border-left:1px solid var(--edge);box-shadow:var(--shadow);display:none;z-index:6}
.ovc{width:100%;height:100%;display:flex;flex-direction:column;padding:16px 18px;gap:12px;animation:sin var(--dur) var(--ease)}
#ov.out .ovc{animation:sout .14s ease forwards}
.ovh{display:flex;justify-content:space-between;align-items:flex-start}
.ovh b{font:600 20px -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}.ovh small{display:block;color:var(--mute);font-size:12px;margin-top:2px}
.ovh button{border:0;background:none;color:var(--mute);font-size:22px;cursor:pointer;line-height:1}
#ovb{overflow:auto;line-height:1.55}#ovb p{margin:0 0 10px}#ovb h4{margin:14px 0 6px}#ovb h4 small{color:var(--mute);font-weight:400}
.nt{color:var(--mute);font-size:12px}#ovb ul{margin:0 0 8px;padding-left:20px}
#ovb details{border-top:1px solid var(--edge);padding:7px 0}#ovb summary{cursor:pointer;font-weight:500}
.lg{display:flex;flex-direction:column;gap:6px;padding:10px;border:1px solid var(--edge);border-radius:10px;font-size:13px}
.lg div{display:flex;flex-wrap:wrap;gap:4px 14px}.lg label{display:flex;gap:6px;align-items:center;cursor:pointer}
@keyframes sin{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes sout{to{opacity:0;transform:translateX(24px)}}
#stage,#graph{right:var(--rw,0px);transition:right var(--dur) var(--ease)}
body.rs #stage,body.rs #graph{transition:none}body.rs{user-select:none;cursor:col-resize}
#ovr{position:absolute;left:-5px;top:0;bottom:0;width:11px;cursor:col-resize;z-index:2}
#ovr::after{content:"";position:absolute;left:5px;top:0;bottom:0;width:2px;background:transparent;transition:background .15s}
#ovr:hover::after,body.rs #ovr::after{background:var(--line)}
.ovh{padding-right:46px}#ovb{flex:1;min-height:0}
#hb{position:fixed;top:12px;right:12px;z-index:7;width:38px;height:38px;border-radius:10px;background:var(--ui);border:1px solid var(--edge);box-shadow:var(--shadow);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
#hb:hover{background:var(--bg)}
#hb svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#hb:hover::after{content:attr(data-tip);position:absolute;top:calc(100% + 8px);right:0;background:var(--ink);color:var(--bg);padding:5px 9px;border-radius:7px;font-size:12px;white-space:nowrap;pointer-events:none}
/* type + spacing system: one title size, 4/8/12/20 rhythm, 16px side gutters in sidebar, history panel and notes */
:root{--px:16px;--s1:4px;--s2:8px;--s3:12px;--s4:20px;--f-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;--f-serif:var(--f-ui)}
.sh .ht,.ovh b,.t{font-size:17px;line-height:1.25;font-weight:600;letter-spacing:-.01em}
.sh .ht{font-family:var(--f-ui)}.ovh b,.t{font-family:var(--f-serif)}
.sh{padding:var(--px) 12px var(--s3) var(--px)}.ht{gap:var(--s1)}
#wl{padding:2px var(--s2) var(--s2)}
#wl li{padding:7px var(--s2);gap:var(--s2);font-size:13.5px;line-height:1.35}
#wl li.fo{font-size:12.5px}#wl em{font-size:12px}
.bar{padding:0 var(--px)}.t{padding:var(--s1) var(--px) var(--s2)}
.b,.ed{padding:0 var(--px) var(--s3);font-size:14px;line-height:1.55}
.fm{padding:var(--s2) var(--px) var(--s3)}
.fc,.pv2{margin-left:var(--px);margin-right:var(--px)}.pv2{margin-bottom:var(--s3)}
.pvs{padding:0 var(--px) var(--s3);gap:var(--s3)}.bl{padding:0 var(--px) var(--s3);gap:var(--s2)}
.ovc{padding:var(--px);gap:0}.ovh{margin-bottom:var(--s4);padding-right:46px}
.ovh small{margin-top:6px;font-size:12px;line-height:1.4}#ov .seg{margin-bottom:var(--s3)}
#ovb p{margin:0 0 14px;font-size:13.5px;line-height:1.6}
#ovb p:first-child{font:500 15px/1.55 var(--f-ui)}
#ovb h4{margin:var(--s4) 0 var(--s2);font:600 11px/1.3 var(--f-ui);text-transform:uppercase;letter-spacing:.07em;color:var(--mute)}
#ovb h4 small{text-transform:none;letter-spacing:0;font-size:12px;font-weight:400;margin-left:var(--s2)}
#ovb ul{padding-left:18px;margin:0 0 var(--s3)}#ovb li{margin-bottom:var(--s1);font-size:13.5px;line-height:1.55}
#ovb details{padding:var(--s3) 0}#ovb summary{font-size:13px;margin-bottom:var(--s2)}
#ovb p.nt:last-child{margin-top:var(--s4);font-size:12px}
.lg{padding:var(--s3) 14px;gap:var(--s2);margin-bottom:var(--s1)}
#side{left:0;top:0;bottom:0;width:var(--sw,250px);border-radius:0;border-width:0 1px 0 0;box-shadow:none}
#stage{left:var(--lw,0px);transition:left var(--dur) var(--ease),right var(--dur) var(--ease)}
#sr{position:absolute;right:-5px;top:0;bottom:0;width:11px;cursor:col-resize;z-index:2}
#sr::after{content:"";position:absolute;left:5px;top:0;bottom:0;width:2px;background:transparent;transition:background .15s}
#sr:hover::after,body.rs #sr::after{background:var(--line)}
#gt{position:absolute;left:calc(50% + var(--lw,0px)/2);bottom:18px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:var(--ui);padding:8px 10px;border-radius:14px;box-shadow:var(--shadow);border:1px solid var(--edge);width:min(740px,calc(100% - var(--lw,0px) - 80px));font-size:12px}

<script>
const $=s=>document.querySelector(s), stage=$('#stage'), world=$('#world'), svg=$('#links');
const uid=()=>Math.random().toString(36).slice(2,9), LK=/\[\[([^\[\]]+?)\]\]/g;

  S.notes[c]={id:c,title:'Shortcuts',x:470,y:230,w:280,c:1,body:'N  new note\n⌘K  find a note\n0  fit everything\nClick the circle on a card to change its color.'};
}
ROOT=ROOT&&ROOT.list?ROOT:{cur:S.id,list:[S]};ROOT.cur=S.id;let N=S.notes; const els={}; let saveT;

function toast(m){const t=$('#toast');t.textContent=m;t.style.opacity=1;clearTimeout(t._t);t._t=setTimeout(()=>t.style.opacity=0,2200)}
const byTitle=t=>Object.values(N).find(n=>n.title.trim().toLowerCase()===t.trim().toLowerCase());
const linksOf=n=>[...n.body.matchAll(LK)].map(m=>m[1].trim());

/* view */
function apply(){const v=S.view;world.style.transform=`translate(${v.x}px,${v.y}px) scale(${v.k})`;
  stage.style.backgroundSize=`${24*v.k}px ${24*v.k}px`;stage.style.backgroundPosition=`${v.x}px ${v.y}px`;

  if(e.ctrlKey||e.metaKey)zoomAt(e.clientX,e.clientY,Math.exp(-e.deltaY*(e.ctrlKey?.01:.004)));

  const p=toWorld(e.clientX,e.clientY);newNote(p.x-130,p.y-20,true)});

/* helpers: files, previews, colors, connections */
const LU=/\[\[([^\[\]]+?)\]\]|(https?:\/\/[^\s<>"')\]]+)|@\[([^\[\]]+?)\]/g;
const urlsOf=b=>[...new Set((b.match(/https?:\/\/[^\s<>"')\]]+/g)||[]).map(u=>u.replace(/[.,;:!?]+$/,'')))].slice(0,3);

  try{const j=(await(await fetch('https://api.microlink.io/?url='+encodeURIComponent(u))).json()).data;
    return S.meta[u]={t:j.title||'',d:j.description||'',i:(j.image&&j.image.url)||'',p:j.publisher||''}}catch(e){}
  try{const j=await(await fetch('https://noembed.com/embed?url='+encodeURIComponent(u))).json();
    if(j.title)return S.meta[u]={t:j.title,d:'',i:j.thumbnail_url||'',p:j.provider_name||''}}catch(e){}
  return{t:'',d:'',i:'',p:''}}
function preview(u){const d=el$('div','pv');
  if(IMG.test(u)){d.append(el$('img','',{src:u}));return d}
  if(VID.test(u)){d.append(el$('video','',{src:u,controls:true}));return d}
  const yt=u.match(YT),vm=u.match(VM),emb=yt?`https://www.youtube.com/embed/${yt[1]}?autoplay=1`:vm?`https://player.vimeo.com/video/${vm[1]}?autoplay=1`:'';
  const th=el$('div','th'),tx=el$('a','tx',{href:u,target:'_blank',rel:'noopener'}),ti=el$('strong','',{textContent:host(u)}),sm=el$('small');
  tx.append(ti,sm);d.append(th,tx);
  if(yt)th.append(el$('img','',{src:`https://i.ytimg.com/vi/${yt[1]}/hqdefault.jpg`}));

  return `<path d="${d}"${e?' class="m"':''}/>`+(e?`<path d="${d}" class="hit" data-e="${e}"/>`:'')+
    `<polygon points="${x2},${y2} ${x2-s*Math.cos(ang-.4)},${y2-s*Math.sin(ang-.4)} ${x2-s*Math.cos(ang+.4)},${y2-s*Math.sin(ang+.4)}"/>`}
function drawLinks(x){let h='';
  for(const n of Object.values(N)){const ts=new Set(linksOf(n)),a=document.activeElement;
    if(a&&a.classList&&a.classList.contains('ed')&&els[n.id].contains(a))linksOf({body:a.value}).forEach(t=>ts.add(t));
    for(const t of ts){const g=byTitle(t);if(g&&g!==n)h+=arrow(n,g)}}
  for(const e of S.edges){const a=N[e.a],b=N[e.b];if(a&&b)h+=arrow(a,b,e.id)}
  svg.innerHTML=h+(x||'')}
function goTo(id,k){const n=N[id],r=rect(n),v=S.view;v.k=k||Math.max(v.k,.9);
  v.x=(innerWidth-RW()-LW())/2-(r.x+r.w/2)*v.k;v.y=innerHeight/2-(r.y+r.h/2)*v.k;
  stage.style.transition='';apply();const el=els[id];el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),1100)}
function fit(){const a=Object.values(N);if(!a.length)return;let x1=1e9,y1=1e9,x2=-1e9,y2=-1e9;
  for(const n of a){const r=rect(n);x1=Math.min(x1,r.x);y1=Math.min(y1,r.y);x2=Math.max(x2,r.x+r.w);y2=Math.max(y2,r.y+r.h)}
  const k=Math.min(1.2,Math.max(.15,Math.min((innerWidth-RW()-LW()-120)/(x2-x1),(innerHeight-180)/(y2-y1))));
  S.view.k=k;S.view.x=(innerWidth-RW()-LW()-(x2-x1)*k)/2-x1*k;S.view.y=(innerHeight-(y2-y1)*k)/2-y1*k-20;apply()}

/* find */
const F=$('#find'),fi=$('#fi'),fl=$('#fl');let sel=0,res=[];
function openFind(){F.style.display='flex';fi.value='';fi.focus();list()}
function closeFind(){F.style.display='none'}
function list(){const q=fi.value.toLowerCase();
  res=Object.values(N).filter(n=>(n.title+' '+n.body).toLowerCase().includes(q)).slice(0,30);sel=0;
  fl.innerHTML=res.map((n,i)=>`<li class="${i?'':'on'}" data-i="${i}">${esc(n.title||'Untitled')}</li>`).join('')||'<li>No matching notes</li>'}
fi.addEventListener('input',list);
fl.addEventListener('click',e=>{const li=e.target.closest('li[data-i]');if(li){closeFind();goTo(res[li.dataset.i].id)}});
fi.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeFind();
  else if(e.key==='Enter'&&res[sel]){closeFind();goTo(res[sel].id)}
  else if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();sel=(sel+(e.key==='ArrowDown'?1:-1)+res.length)%res.length;
    [...fl.children].forEach((c,i)=>c.classList.toggle('on',i===sel))}});
F.addEventListener('pointerdown',e=>{if(e.target===F)closeFind()});

/* keys & toolbar */
addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openFind();return}
  const ae=document.activeElement;if(/INPUT|TEXTAREA|SELECT/.test(ae.tagName)||ae.isContentEditable)return;
  if(e.key==='n'&&!gOpen){e.preventDefault();const p=toWorld(innerWidth/2,innerHeight/2);newNote(p.x-130,p.y-60,true)}
  if(e.key==='0')fit();
  if((e.metaKey||e.ctrlKey)&&(e.key==='='||e.key==='+')){e.preventDefault();zoomAt(innerWidth/2,innerHeight/2,1.2)}
  if((e.metaKey||e.ctrlKey)&&e.key==='-'){e.preventDefault();zoomAt(innerWidth/2,innerHeight/2,1/1.2)}});
$('#bNew').onclick=()=>{const p=toWorld(innerWidth/2,innerHeight/2);newNote(p.x-130,p.y-60,true)};
$('#bFind').onclick=openFind;$('#bFit').onclick=fit;
$('#bIn').onclick=()=>zoomAt(innerWidth/2,innerHeight/2,1.2);$('#bOut').onclick=()=>zoomAt(innerWidth/2,innerHeight/2,1/1.2);
$('#bExp').onclick=async()=>{const m={};for(const w of ROOT.list)for(const n of Object.values(w.notes))for(const k of midsOf(n)){const f=await idb('get',k);if(f)m[k]=await du(f)}const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify({...ROOT,media:m},null,1)],{type:'application/json'}));
  a.download='threadboard-'+new Date().toISOString().slice(0,10)+'.json';a.click();toast('Backup downloaded')};
$('#bImp').onclick=()=>$('#file').click();
$('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=async()=>{try{const d=JSON.parse(r.result);if(!d.notes&&!d.list)throw 0;
    if(!confirm('Replace the current board with this backup?'))return;
    for(const[k,u]of Object.entries(d.media||{}))await idb('put',k,await(await fetch(u)).blob());delete d.media;const rt=d.list?d:{cur:'w1',list:[{id:'w1',name:'Imported',...d}]};storeSync(JSON.stringify(rt));location.reload()}catch(x){toast('That file is not a Threadboard backup')}};
  r.readAsText(f);e.target.value=''};
addEventListener('beforeunload',()=>{try{store(JSON.stringify(ROOT))}catch(e){}});

ROOT.list.forEach(w=>{w.created=w.created||Date.now();w.mod=w.mod||w.created});S.edges=S.edges||[];theme();ROOT.list.forEach(reconcile);SS=newSS();setSide();setBar(1);side();Object.values(N).forEach(build);refresh();apply();
</script>
</body>
